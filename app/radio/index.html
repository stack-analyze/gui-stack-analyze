<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>radio stations</title>
  <!-- normalize -->
  <link rel="stylesheet" href="../../node_modules/normalize.css/normalize.css" />
  <!-- local css -->
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <main class="app">
    <fieldset class="input-field">
      <input type="text" placeholder="enter a country only eng name">

      <button class="btn btn-primary" id="get-stations">Get</button>
      <button class="btn btn-secondary" id="clear-stations">Clear</button>
    </fieldset>

    <ul class="stations-list" id="stations-list"></ul>

    <button id="stop-radio" class="fab">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="6" width="12" height="12" rx="2" />
      </svg>
    </button>
  </main>

  <script src="./renderer.js"></script>
</body>

</html>
